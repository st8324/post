name: CI/CD with Docker (Spring + FastAPI)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 1. Spring+React 이미지 빌드/푸시
      - name: Build Spring Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/post:latest

      # 2. FastAPI 이미지 빌드/푸시 (context 경로 주의)
      - name: Build FastAPI Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai_server # FastAPI 소스 경로
          file: ./ai_server/Dockerfile # Dockerfile의 정확한 경로
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ai_server:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"

            # 전문가의 팁: Docker 네트워크 생성 (서버간 통신용)
            sudo docker network create app-network || true

            # 3. FastAPI(AI) 서버 배포
            sudo docker stop ai_server || true
            sudo docker rm ai_server || true
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/ai_server:latest
            sudo docker run -d \
              --name ai_server \
              --network app-network \
              -p 8000:8000 \
              -e GOOGLE_AI_API_KEY="${{ secrets.GOOGLE_AI_API_KEY }}" \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/ai_server:latest

            # 4. Spring 서버 배포 (AI 서버 정보를 환경변수로 전달)
            sudo docker stop post || true
            sudo docker rm post || true
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/post:latest
            sudo docker run -d \
              -p 80:8080 \
              --name post \
              --network app-network \
              -e AI_SERVER_URL="http://ai_server:8000" \
              -e DB_URL="${{ secrets.DB_URL }}" \
              -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/post:latest

            sudo docker image prune -f
