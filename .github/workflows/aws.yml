name: CI/CD with Docker

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Docker Hub 로그인 (최신 v3 사용)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Docker 이미지 빌드 및 푸시 (수동 run 대신 공식 action 사용 권장)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/post:latest

      # 4. EC2 접속 및 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Docker Hub 로그인 (Private 저장소인 경우 필수)
            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # 기존 컨테이너가 있는지 확인 후 처리 (에러 로그 방지)
            if [ "$(sudo docker ps -aq -f name=post)" ]; then
                sudo docker stop post
                sudo docker rm post
            fi

            # 최신 이미지 풀
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/post:latest

            # 새 컨테이너 실행
            sudo docker run -d \
              -p 80:8080 \
              --name post \
              -e DB_URL="${{ secrets.DB_URL }}" \
              -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/post:latest

            # 사용하지 않는 이미지 정리
            sudo docker image prune -f
